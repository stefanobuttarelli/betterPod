name: Knulli checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  knulli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compiler and test environment
        run: docker build -t betterpod-build:1 -f tools/Dockerfile tools
      - name: Unit tests
        run: tools/unittest.sh
      - name: Release tooling tests
        run: python3 -m unittest discover -s tools -p 'test_gh_releases.py' -v
      - name: Build Knulli package
        run: tools/docker-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: betterpod-knulli
          path: dist/betterpod-knulli.zip
