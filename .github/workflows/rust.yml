# betterPod Rust, the separate Knulli app (rust/).
#
# Every push that touches it builds the console package and keeps it as an
# artifact. A tag rust-vX.Y.Z (the version in rust/Cargo.toml) publishes it:
# a pre-release "betterPod Rust X.Y.Z" with the zip, and the rolling
# pre-release "rust-latest" with latest-rust.json, the manifest the app's own
# Software Update reads (updater::DEFAULT_FEED). Neither is ever "Latest":
# that stays on the Go app's releases.
name: Rust app
on:
  push:
    branches: [main, codex/rust-player-mac-library]
    paths: [rust/**, port/betterpod/**, DESIGN.md, src/puzzles/**, src/words/**, .github/workflows/rust.yml]
    tags: ['rust-v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t betterpod-build:1 -f tools/Dockerfile tools
          docker build -t betterpod-rust-build:1 -f rust/tools/Dockerfile .
      - name: Tests
        run: rust/tools/build.sh test
      - name: Build for Knulli (AArch64, glibc 2.28)
        run: rust/tools/build.sh knulli
      - name: Package
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          rust/tools/package.sh
          ls -l dist/betterpod-rust-experimental.zip
      - uses: actions/upload-artifact@v4
        with:
          name: betterpod-rust
          path: dist/betterpod-rust-experimental.zip
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/rust-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=${GITHUB_REF_NAME}
          version=${tag#rust-v}
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n 1)
          [ "$version" = "$cargo_version" ] || { echo "Tag $tag but rust/Cargo.toml says $cargo_version" >&2; exit 1; }
          zip=betterpod-rust-$version.zip
          cp dist/betterpod-rust-experimental.zip "$zip"
          git fetch --depth=1 origin "+refs/tags/$tag:refs/tags/$tag"
          notes=$(git tag -l --format='%(contents)' "$tag")
          [ -n "$notes" ] || notes="betterPod Rust $version"
          python3 - "$version" "$zip" "$notes" "$GITHUB_REPOSITORY" "$tag" <<'PY'
          import hashlib, json, os, sys
          version, zip_name, notes, repo, tag = sys.argv[1:]
          data = open(zip_name, 'rb').read()
          manifest = {
              "application": "betterpod-rust",
              "version": version,
              "arch": "aarch64-linux",
              "url": f"https://github.com/{repo}/releases/download/{tag}/{zip_name}",
              "size": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
              "notes": notes,
          }
          open('latest-rust.json', 'w').write(json.dumps(manifest, indent=2) + '\n')
          PY
          cat latest-rust.json
          install="Extract the zip into /userdata/roms/ports (it adds 'betterPod Rust.sh' and betterpod-rust/ beside betterPod), then update the games list. Later versions come through its own Settings > Software Update."
          gh release create "$tag" "$zip" --prerelease --latest=false \
            --title "betterPod Rust $version" --notes "$(printf '%s\n\n%s\n' "$notes" "$install")"
          # the channel: one rolling pre-release holding the manifest
          if ! gh release view rust-latest > /dev/null 2>&1; then
            gh release create rust-latest --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "betterPod Rust: update channel" \
              --notes "The manifest betterPod Rust's Software Update reads. It always points to the newest betterPod Rust release."
          fi
          gh release upload rust-latest latest-rust.json --clobber
